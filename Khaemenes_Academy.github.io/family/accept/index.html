<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khaemenes Academy · Accept Family Invitation</title>
<style>
body{margin:0;display:grid;place-items:center;min-height:100vh;padding:1rem;background:#eef3f5;color:#26313a;font:16px/1.6 "Segoe UI",Arial,sans-serif}.card{width:min(680px,100%);padding:2rem;border-radius:14px;background:#fff;box-shadow:0 18px 50px rgba(22,36,55,.12);text-align:center}h1{font:400 2.4rem Georgia,serif;color:#17233d}.state{margin:1rem 0;padding:1rem;border-radius:9px;background:#fff4d5;color:#785b29}.ok{background:#e8f6eb;color:#2d683e}.error{background:#fcebed;color:#8d4049}a{color:#315f45;font-weight:700}
</style>
</head>
<body>
<main class="card">
  <h1>Family Invitation</h1>
  <p id="message">Checking this invitation…</p>
  <div id="state" class="state">No access has been changed yet.</div>
  <p><a href="../">Open Family Profile</a></p>
</main>
<script src="../../assets/khaemenes-family-invite-client.js"></script>
<script>
(async()=>{
  const message=document.getElementById("message");
  const state=document.getElementById("state");
  const token=new URLSearchParams(location.search).get("token") || "";

  if(!token){
    message.textContent="This invitation link does not contain a token.";
    state.className="state error";
    state.textContent="Nothing was accepted.";
    return;
  }

  const client=window.KhaemenesFamilyInviteClient;
  if(!client.serverStatus().emailInvitesAvailable){
    message.textContent="The secure Family Account service is not connected yet.";
    state.className="state";
    state.textContent="Static GitHub mode cannot securely validate a cross-device invitation. The token was not stored in this browser.";
    return;
  }

  const response=await client.acceptInvite(token);
  if(response.ok){
    message.textContent="Invitation accepted.";
    state.className="state ok";
    state.textContent="Your adult account is now linked according to the inviter's permissions.";
    history.replaceState(null,"",location.pathname);
  }else{
    message.textContent="This invitation could not be accepted.";
    state.className="state error";
    state.textContent="It may have expired, been revoked, or already been used.";
  }
})();
</script>
</body>
</html>

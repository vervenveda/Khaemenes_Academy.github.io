name: Academy Landing Shell Validation
on:
  push:
    branches: [main, academy-t03-primary-crossover]
    paths:
      - 'assets/khaemenes-landing-standard.css'
      - 'assets/khaemenes-landing-toolbar.css'
      - 'assets/khaemenes-hall-typography.css'
      - 'assets/khaemenes-landing-toolbar.js'
      - 'index.html'
      - 'student/index.html'
      - 'family/index.html'
      - 'adult/index.html'
      - 'teacher-admin/index.html'
      - 'offline/index.html'
      - 'tests/academy-landing-shell-validation.mjs'
      - '.github/workflows/academy-landing-shell-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sovereign vanilla JavaScript syntax
        run: node --check assets/khaemenes-landing-toolbar.js
      - name: Validate Academy Home layout and portal entrance wiring
        run: node tests/academy-landing-shell-validation.mjs

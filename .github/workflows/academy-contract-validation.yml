name: Academy Contract Validation

on:
  pull_request:
    paths:
      - 'ACADEMY_MASTERY_ACCESS_CONTRACT_V1.md'
      - 'assets/khaemenes-naib-mentor-router.js'
      - 'tests/lifelong-mentor-contract-static.test.mjs'
      - '.github/workflows/academy-contract-validation.yml'
  push:
    branches: [ main ]
    paths:
      - 'ACADEMY_MASTERY_ACCESS_CONTRACT_V1.md'
      - 'assets/khaemenes-naib-mentor-router.js'
      - 'tests/lifelong-mentor-contract-static.test.mjs'
      - '.github/workflows/academy-contract-validation.yml'

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check NAIB router syntax
        run: node --check assets/khaemenes-naib-mentor-router.js
      - name: Validate lifelong mentor and mastery contract
        run: node tests/lifelong-mentor-contract-static.test.mjs

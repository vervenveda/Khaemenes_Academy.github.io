name: Academy Ecosystem Toolbar Coverage

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/audit-ecosystem-toolbar.mjs'
      - 'assets/vnv-beta-link.js'
      - 'assets/vnv-ecosystem-toolbar.js'
      - '.github/workflows/beta-link-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify one canonical ecosystem toolbar per Academy HTML page
        run: node scripts/audit-ecosystem-toolbar.mjs

name: Academy Home Personalization Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'assets/khaemenes-home-personalization.js'
      - 'assets/khaemenes-front-door-router.js'
      - 'assets/khaemenes-learning-continuation.js'
      - 'assets/khaemenes-family-registry.js'
      - 'tests/home-personalization-static.test.mjs'
      - '.github/workflows/home-personalization-validation.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/khaemenes-home-personalization.js'
      - 'assets/khaemenes-front-door-router.js'
      - 'assets/khaemenes-learning-continuation.js'
      - 'assets/khaemenes-family-registry.js'
      - 'tests/home-personalization-static.test.mjs'
      - '.github/workflows/home-personalization-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check personalization syntax
        run: node --check assets/khaemenes-home-personalization.js
      - name: Check front-door router syntax
        run: node --check assets/khaemenes-front-door-router.js
      - name: Validate account-aware Academy home
        run: node tests/home-personalization-static.test.mjs

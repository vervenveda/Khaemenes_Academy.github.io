name: Multilingual Source Coverage
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/vnv-language.js'
      - 'scripts/audit-i18n.mjs'
      - '.github/workflows/i18n-source-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inventory public interface strings
        run: node scripts/audit-i18n.mjs
      - name: Archive missing translation phrases
        uses: actions/upload-artifact@v4
        with:
          name: i18n-public-source-coverage
          path: artifacts/i18n-source-coverage.json
          retention-days: 30

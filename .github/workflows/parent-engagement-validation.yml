name: Academy Parent Engagement Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'family/index.html'
      - 'assets/khaemenes-parent-action-center.js'
      - 'assets/khaemenes-family-support-plan.js'
      - 'assets/khaemenes-learning-continuation.js'
      - 'assets/khaemenes-family-registry.js'
      - 'assets/khaemenes-learning-science.js'
      - 'tests/parent-engagement-static.test.mjs'
      - '.github/workflows/parent-engagement-validation.yml'
  pull_request:
    paths:
      - 'family/index.html'
      - 'assets/khaemenes-parent-action-center.js'
      - 'assets/khaemenes-family-support-plan.js'
      - 'assets/khaemenes-learning-continuation.js'
      - 'assets/khaemenes-family-registry.js'
      - 'assets/khaemenes-learning-science.js'
      - 'tests/parent-engagement-static.test.mjs'
      - '.github/workflows/parent-engagement-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-parent-engagement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check parent feature syntax
        run: |
          node --check assets/khaemenes-parent-action-center.js
          node --check assets/khaemenes-family-support-plan.js
      - name: Validate parent engagement contract
        run: node tests/parent-engagement-static.test.mjs

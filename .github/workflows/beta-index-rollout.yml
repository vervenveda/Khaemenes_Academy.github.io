name: Beta Program index rollout

on:
  push:
    paths:
      - '.github/workflows/beta-index-rollout.yml'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Add Beta Program widget to public index pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          WIDGET = '<script src="https://vervenveda.com/assets/vnv-beta-link.js" defer></script>'
          marker = 'vnv-beta-link.js'
          changed = []
          for path in sorted(Path('.').rglob('index.html')):
              parts = set(path.parts)
              if '.git' in parts or '.github' in parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if marker in text:
                  continue
              pos = text.lower().rfind('</body>')
              if pos < 0:
                  continue
              text = text[:pos] + '\n  <!-- Verve N Veda Beta Program -->\n  ' + WIDGET + '\n' + text[pos:]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))
          print(f'Beta widget added to {len(changed)} index page(s).')
          for item in changed:
              print(item)
          PY
      - name: Commit rollout
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No index pages required changes.'
            exit 0
          fi
          git config user.name 'Verve N Veda Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'Add Beta Program button to all index pages'
          git push

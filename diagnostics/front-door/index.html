<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khaemenes Front Door Diagnostics</title><style>body{font:15px/1.55 Arial,sans-serif;margin:0;background:#f6f3eb;color:#1c2732}.wrap{width:min(900px,calc(100% - 32px));margin:40px auto}.card{background:#fff;border:1px solid #d8d3c8;border-radius:7px;padding:20px;margin:14px 0}.pass{color:#285f3c}.fail{color:#913d49}code{background:#f1eee7;padding:2px 5px;border-radius:4px;overflow-wrap:anywhere}h1{font-family:Georgia,serif}.summary{font-size:18px}</style></head><body><main class="wrap"><h1>Khaemenes Front Door Diagnostics</h1><p>Runtime checks for the public-safe family → learner → exact grade → learner context → NAIB → school routing contract. This page does not create or modify learner records.</p><div id="out"></div></main><script src="../../assets/khaemenes-family-registry.js"></script><script src="../../assets/khaemenes-learner-context.js"></script><script src="../../assets/khaemenes-naib-mentor-router.js"></script><script src="../../assets/khaemenes-front-door-router.js"></script><script>(()=>{const out=document.getElementById('out'),R=window.KhaemenesFamilyRegistry,C=window.KhaemenesLearnerContext,N=window.KhaemenesNAIB,F=window.KhaemenesFrontDoorRouter;const rows=[];const check=(ok,label,detail='')=>rows.push({ok:Boolean(ok),label,detail});check(Boolean(R),'Family Registry loaded');check(R?.version==='1.1.0','Family Registry v1.1.0',R?.version);check(Boolean(C?.placementFor),'Canonical learner context loaded',C?.version);check(Boolean(C?.courseScope),'Course-scoped learner context available');check(Boolean(C?.storageKey),'Learner-scoped storage helper available');check(Boolean(N?.routeLearnerEntry),'NAIB learner entry routing available',N?.version);check(Boolean(F?.routeForLearner),'Front Door Router available',F?.version);check(F?.version==='1.1.0','Front Door Router v1.1.0',F?.version);const expected={'pre-k':'preschool','k':'kindergarten','01':'elementary','05':'elementary','06':'middle','08':'middle','09':'high','12':'high'};for(const [grade,stage] of Object.entries(expected)){const p=R?.canonicalPlacement?.({stage:'high',grade});check(p?.stage===stage&&p?.grade===grade,`${grade} maps to ${stage}`,JSON.stringify(p));const d=R?.destinationFor?.({grade});check(Boolean(d?.url)&&d?.stage===stage,`${grade} has destination`,d?.url||'');const fake={learnerId:`diagnostic-${grade}`,accountId:`acct-${grade}`,familyId:'diagnostic-family',nickname:'Diagnostic Learner',grade,stage};const c=C?.placementFor?.(fake);check(c?.stage===stage&&c?.grade===grade,`Learner context resolves ${grade}`,JSON.stringify(c));const n=N?.routeLearnerEntry?.({learnerId:fake.learnerId,grade,stage,surface:'diagnostics'});check(n?.stage===stage&&Boolean(n?.destination),`NAIB routes ${grade}`,n?.destination||'')}const surface=C?.surfaceState?.({stage:'middle',grades:['06','07','08']},{learnerId:'diagnostic',grade:'09',stage:'high'});check(surface?.stageMismatch===true,'Surface mismatch is detected',JSON.stringify(surface));check(surface?.hardRedirect===false,'Mismatch policy never hard-redirects');check(N?.routeLearnerEntry?.({learnerId:'diagnostic',grade:'09',stage:'elementary'})?.authority?.changesPlacement===false,'NAIB cannot change placement');const scoped=C?.courseScope?.({courseId:'diagnostic-course',subject:'science',grade:'09'});check(scoped?.authority?.changesPlacement===false&&scoped?.authority?.awardsMastery===false,'Course context has no placement/mastery authority');const key=C?.storageKey?.('khaemenes.course',{learnerId:'learner-test',courseId:'science-09'});check(key==='khaemenes.course:learner-test:science-09','Learner-scoped storage key is deterministic',key);const passed=rows.filter(r=>r.ok).length;out.innerHTML=`<div class="card summary"><strong>${passed}/${rows.length} checks passed</strong></div>`+rows.map(r=>`<div class="card"><strong class="${r.ok?'pass':'fail'}">${r.ok?'PASS':'FAIL'} · ${r.label}</strong>${r.detail?`<div><code>${String(r.detail).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</code></div>`:''}</div>`).join('')})();</script>
<script src="/assets/vnv-beta-link.js" defer></script>
</body></html>

name: Student Route Validation

on:
  pull_request:
    paths:
      - 'assets/khaemenes-front-door-router.js'
      - 'student/index.html'
      - 'assets/khaemenes-student-profile-v2.js'
      - 'assets/khaemenes-student-profile-ui-v2.js'
      - 'assets/khaemenes-student-profile-v2.css'
      - 'assets/khaemenes-student-quick-pins-v1.js'
      - 'tests/student-profile-v2-static.test.mjs'
      - 'tests/student-quick-pins-v1-static.test.mjs'
      - 'tests/student-route-static.test.mjs'
      - 'tests/student-two-learner-isolation.test.cjs'
      - '.github/workflows/student-route-validation.yml'
  push:
    branches: [ main ]
    paths:
      - 'assets/khaemenes-front-door-router.js'
      - 'student/index.html'
      - 'assets/khaemenes-student-profile-v2.js'
      - 'assets/khaemenes-student-profile-ui-v2.js'
      - 'assets/khaemenes-student-profile-v2.css'
      - 'assets/khaemenes-student-quick-pins-v1.js'
      - 'tests/student-profile-v2-static.test.mjs'
      - 'tests/student-quick-pins-v1-static.test.mjs'
      - 'tests/student-route-static.test.mjs'
      - 'tests/student-two-learner-isolation.test.cjs'
      - '.github/workflows/student-route-validation.yml'

permissions:
  contents: read

jobs:
  validate-student-route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check router syntax
        run: node --check assets/khaemenes-front-door-router.js
      - name: Check student profile v2 syntax
        run: |
          node --check assets/khaemenes-student-profile-v2.js
          node --check assets/khaemenes-student-profile-ui-v2.js
      - name: Check student Quick Pins syntax
        run: node --check assets/khaemenes-student-quick-pins-v1.js
      - name: Validate student routes
        run: node tests/student-route-static.test.mjs
      - name: Validate two-learner isolation with fictional records
        run: node tests/student-two-learner-isolation.test.cjs
      - name: Validate student profile v2
        run: node --test tests/student-profile-v2-static.test.mjs
      - name: Validate student Quick Pins
        run: node --test tests/student-quick-pins-v1-static.test.mjs
